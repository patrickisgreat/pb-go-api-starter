version: "2"

run:
  timeout: 10m

linters:
  exclusions:
    paths:
      - rpc

formatters:
  enable:
    - goimports
  settings:
    goimports:
      # Import paths with these prefixes are grouped after third-party packages.
      local-prefixes:
        - github.com/patrickisgreat/pb-go-api-starter
  exclusions:
    paths:
      - rpc
